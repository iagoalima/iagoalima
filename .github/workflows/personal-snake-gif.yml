name: Generate Personal Snake GIF

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/generate_personal_snake.py"
      - ".github/workflows/personal-snake-gif.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --upgrade pillow
      - name: Generate animated GIF
        run: python .github/scripts/generate_personal_snake.py
      - name: Commit GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/personal-snake.gif
          if git diff --cached --quiet; then
            echo "GIF is already up to date."
          else
            git commit -m "chore: regenerate personal snake GIF"
            git push
          fi
