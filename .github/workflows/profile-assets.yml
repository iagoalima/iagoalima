name: Generate Profile SVGs

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-svg-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generate profile SVGs
        run: python .github/scripts/generate_profile_assets.py

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/activity.svg assets/profile/achievements.svg
          if git diff --cached --quiet; then
            echo "Profile SVGs are already up to date."
            exit 0
          fi
          git commit -m "chore: update profile SVG assets"
          git push
