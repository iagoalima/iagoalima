<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
<title id="title">Neon snake tracing IAGO LIMA, IFCE and BOAMA</title>
<desc id="desc">A glowing blue segment travels along the outlines of each word in sequence: IAGO LIMA, IFCE, then BOAMA, looping continuously.</desc>
<defs>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
 <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#18314D" stroke-width="1" opacity=".55"/></pattern>
</defs>
<rect width="1000" height="260" rx="18" fill="#050816"/>
<rect width="1000" height="260" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="998" height="258" rx="17" fill="none" stroke="#1D4ED8" stroke-opacity=".55"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="76" font-weight="800" letter-spacing="5" text-anchor="middle">
 <text x="500" y="132" class="base b1">IAGO LIMA</text>
 <text x="500" y="132" class="base b2">IFCE</text>
 <text x="500" y="132" class="base b3">BOAMA</text>
 <text x="500" y="132" class="trace p1">IAGO LIMA</text>
 <text x="500" y="132" class="trace p2">IFCE</text>
 <text x="500" y="132" class="trace p3">BOAMA</text>
</g>

<text x="500" y="218" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" letter-spacing="4" fill="#7DD3FC" opacity=".9">PERSONAL SNAKE · NEON BLUE · LOOP</text>
<style>
.base{fill:#DCEBFA;opacity:0}
.b1{animation:show1 12s infinite}.b2{animation:show2 12s infinite}.b3{animation:show3 12s infinite}
.trace{fill:none;stroke:url(#neon);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round;filter:url(#glow);stroke-dasharray:34 1500;stroke-dashoffset:1500;opacity:0}
.p1{animation:trace1 12s linear infinite}.p2{animation:trace2 12s linear infinite}.p3{animation:trace3 12s linear infinite}
@keyframes show1{0%,30%{opacity:1}33%,100%{opacity:0}}
@keyframes show2{0%,32%{opacity:0}35%,63%{opacity:1}66%,100%{opacity:0}}
@keyframes show3{0%,65%{opacity:0}68%,96%{opacity:1}99%,100%{opacity:0}}
@keyframes trace1{0%{opacity:1;stroke-dashoffset:1500}30%{opacity:1;stroke-dashoffset:0}33%,100%{opacity:0;stroke-dashoffset:0}}
@keyframes trace2{0%,32%{opacity:0;stroke-dashoffset:1500}35%{opacity:1;stroke-dashoffset:1500}63%{opacity:1;stroke-dashoffset:0}66%,100%{opacity:0}}
@keyframes trace3{0%,65%{opacity:0;stroke-dashoffset:1500}68%{opacity:1;stroke-dashoffset:1500}96%{opacity:1;stroke-dashoffset:0}99%,100%{opacity:0}}
</style>
</svg>