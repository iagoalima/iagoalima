<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
<title id="title">Iago Lima • IFCE • Boama</title>
<desc id="desc">An animated neon-blue pixel snake moves across three labels in sequence: IAGO LIMA, IFCE, and BOAMA.</desc>
<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#17304B" stroke-width="1" opacity=".5"/></pattern>
</defs>
<rect width="1000" height="260" rx="18" fill="#050816"/>
<rect width="1000" height="260" rx="18" fill="url(#grid)"/>
<rect x="1" y="1" width="998" height="258" rx="17" fill="none" stroke="#1D4ED8" stroke-opacity=".55"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="76" font-weight="800" letter-spacing="5" text-anchor="middle" fill="#EAF6FF" stroke="url(#blue)" stroke-width="1.2" filter="url(#glow)">
  <text x="500" y="130" class="label l1">IAGO LIMA</text>
  <text x="500" y="130" class="label l2">IFCE</text>
  <text x="500" y="130" class="label l3">BOAMA</text>
</g>
<g fill="none" stroke="url(#blue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
  <path class="trace t1" d="M160 160 H840"/>
  <path class="trace t2" d="M340 160 H660"/>
  <path class="trace t3" d="M285 160 H715"/>
</g>
<g filter="url(#glow)">
  <g class="snake s1"><path d="M0 0 h-18 v-12 h-18 v12 h-18" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle r="8" fill="#E0F2FE"/><circle cx="2" cy="-2" r="2" fill="#050816"/><animateMotion dur="4s" repeatCount="indefinite" path="M160 160 H840"/></g>
  <g class="snake s2"><path d="M0 0 h-18 v-12 h-18 v12 h-18" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle r="8" fill="#E0F2FE"/><circle cx="2" cy="-2" r="2" fill="#050816"/><animateMotion dur="4s" begin="4s" repeatCount="indefinite" path="M340 160 H660"/></g>
  <g class="snake s3"><path d="M0 0 h-18 v-12 h-18 v12 h-18" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle r="8" fill="#E0F2FE"/><circle cx="2" cy="-2" r="2" fill="#050816"/><animateMotion dur="4s" begin="8s" repeatCount="indefinite" path="M285 160 H715"/></g>
</g>
<text x="500" y="218" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" letter-spacing="4" fill="#7DD3FC" opacity=".9">PERSONAL SNAKE · NEON BLUE · LOOP</text>
<style>
.label,.trace,.snake{opacity:0}
.l1{animation:a1 12s infinite}.l2{animation:a2 12s infinite}.l3{animation:a3 12s infinite}
.t1{animation:d1 12s linear infinite}.t2{animation:d2 12s linear infinite}.t3{animation:d3 12s linear infinite}
.s1{animation:a1 12s infinite}.s2{animation:a2 12s infinite}.s3{animation:a3 12s infinite}
@keyframes a1{0%,30%{opacity:1}33%,100%{opacity:0}}
@keyframes a2{0%,32%{opacity:0}35%,63%{opacity:1}66%,100%{opacity:0}}
@keyframes a3{0%,65%{opacity:0}68%,96%{opacity:1}99%,100%{opacity:0}}
@keyframes d1{0%{opacity:1;stroke-dasharray:0 680}30%{opacity:1;stroke-dasharray:680 0}33%,100%{opacity:0}}
@keyframes d2{0%,32%{opacity:0;stroke-dasharray:0 320}35%{opacity:1;stroke-dasharray:0 320}63%{opacity:1;stroke-dasharray:320 0}66%,100%{opacity:0}}
@keyframes d3{0%,65%{opacity:0;stroke-dasharray:0 430}68%{opacity:1;stroke-dasharray:0 430}96%{opacity:1;stroke-dasharray:430 0}99%,100%{opacity:0}}
</style>
</svg>